[project]
name = "jira-worklog"
version = "0.1.0"
description = "Local web page that shows your Jira worklogs for one month as a grid and adds new worklogs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Seidler", email = "daniel.seidler@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "jira>=3.10.5",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
jira-worklog = "jira_worklog.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
